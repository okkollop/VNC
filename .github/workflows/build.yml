name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests del protocolo
        run: dotnet test tests/Enlace.Protocol.Tests -c Release --logger "console;verbosity=normal"

      - name: Tests de Windows (captura, ratón, conexión real)
        run: dotnet test tests/Enlace.Windows.Tests -c Release --logger "console;verbosity=normal"

      - name: Publicar ejecutables
        shell: pwsh
        run: |
          foreach ($p in 'Server','Client') {
            dotnet publish src/Enlace.$p -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist
          }
          Copy-Item LEEME.md dist/

      - name: Prueba del modo servicio (instalar, escuchar en 6900, quitar)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/InfollopAssistServidor.exe).Path
          # Simular la otra aplicación InfollopAssist (RustDesk): su servicio y su carpeta
          New-Item -ItemType Directory -Force 'C:\Program Files\InfollopAssist' | Out-Null
          Set-Content 'C:\Program Files\InfollopAssist\otra-app.txt' 'no tocar'
          sc.exe create InfollopAssist binPath= '"C:\Program Files\InfollopAssist\InfollopAssist.exe" --service' start= demand | Out-Null
          $otraAntes = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\InfollopAssist).ImagePath
          $p = Start-Process $exe -ArgumentList '--instalar-servicio' -Wait -PassThru
          "Instalar: código $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content C:\ProgramData\InfollopAssist\servidor.log -ErrorAction SilentlyContinue; exit 1 }
          (Get-Service InfollopAssistServidor).Status
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try {
              $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 6900)
              $buf = New-Object byte[] 12
              $n = $c.GetStream().Read($buf, 0, 12)
              $banner = [Text.Encoding]::ASCII.GetString($buf, 0, $n)
              "Respuesta en 6900: $banner"
              $ok = $banner.StartsWith('RFB 003.008')
              $c.Close()
            } catch { }
          }
          Get-Process InfollopAssistServidor -IncludeUserName -ErrorAction SilentlyContinue | Format-Table Id, SessionId, UserName -AutoSize
          Get-Content C:\ProgramData\InfollopAssist\servidor.log -ErrorAction SilentlyContinue
          $p = Start-Process 'C:\Program Files\InfollopAssist Servidor\InfollopAssistServidor.exe' -ArgumentList '--quitar-servicio' -Wait -PassThru
          "Quitar: código $($p.ExitCode)"
          if (Get-Service InfollopAssistServidor -ErrorAction SilentlyContinue) { 'El servicio sigue instalado'; exit 1 }
          # La otra aplicación tiene que seguir intacta
          $otraDespues = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\InfollopAssist -ErrorAction SilentlyContinue).ImagePath
          "Servicio de la otra app: $otraDespues"
          if ($otraDespues -ne $otraAntes) { 'Se ha tocado el servicio de la otra aplicación'; exit 1 }
          if (-not (Test-Path 'C:\Program Files\InfollopAssist\otra-app.txt')) { 'Se ha borrado la carpeta de la otra aplicación'; exit 1 }
          sc.exe delete InfollopAssist | Out-Null
          if (-not $ok) { 'El agente no llegó a escuchar en el puerto 6900'; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InfollopAssist-Windows-x64
          path: dist/
          retention-days: 30
