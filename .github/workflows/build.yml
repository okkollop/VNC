name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests del protocolo
        run: dotnet test tests/Enlace.Protocol.Tests -c Release --logger "console;verbosity=normal"

      - name: Tests de Windows (captura, ratón, conexión real)
        run: dotnet test tests/Enlace.Windows.Tests -c Release --logger "console;verbosity=normal"

      - name: Publicar ejecutables
        shell: pwsh
        run: |
          foreach ($p in 'Server','Client') {
            dotnet publish src/Enlace.$p -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist
          }
          Copy-Item LEEME.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Enlace-Windows-x64
          path: dist/
          retention-days: 30
