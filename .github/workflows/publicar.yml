name: Publicar versión

# Se lanza a mano: Actions → "Publicar versión" → Run workflow.
# Necesita el secreto INFOLLOP_CLAVE (clave privada de firma).
# Publica una release; soporte.infollop.net la descarga sola (ver job "release").
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de versión (p. ej. 1.0.1). Tiene que ser mayor que la publicada."
        required: true
      notas:
        description: "Qué cambia (lo verán al actualizar)"
        required: false
        default: ""

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/Enlace.Protocol.Tests -c Release

      - name: Compilar con la versión indicada
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { "Versión no válida: $v (formato 1.2.3)"; exit 1 }
          foreach ($p in 'Server','Client') {
            dotnet publish src/Enlace.$p -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
              -p:Version=$v -o publicar
          }

      - name: Firmar (version.json)
        shell: pwsh
        env:
          INFOLLOP_CLAVE: ${{ secrets.INFOLLOP_CLAVE }}
          NOTAS: ${{ inputs.notas }}
        run: |
          if (-not $env:INFOLLOP_CLAVE) { 'Falta el secreto INFOLLOP_CLAVE en GitHub (Settings → Secrets → Actions).'; exit 1 }
          dotnet run --project tools/Firmar -c Release -- publicar '${{ inputs.version }}' "$env:NOTAS"
          Get-Content publicar/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: InfollopAssist-${{ inputs.version }}-actualizacion
          path: publicar/
          retention-days: 90

  # Publica la versión como release pública. El servidor de soporte.infollop.net la
  # recoge solo (cron cada 10 min, /usr/local/bin/infollopassist-sync.sh): así no
  # hace falta guardar ninguna contraseña del servidor en GitHub.
  release:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InfollopAssist-${{ inputs.version }}-actualizacion
          path: publicar

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          v="${{ inputs.version }}"; v="v${v#v}"
          gh release create "$v" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "InfollopAssist $v" --notes "${NOTAS:-Versión $v}" --latest \
            publicar/InfollopAssistServidor.exe publicar/InfollopAssistVisor.exe publicar/version.json
          echo "Publicada $v. soporte.infollop.net la recoge en 10 minutos como mucho."
